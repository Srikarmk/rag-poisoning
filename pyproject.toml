[project]
name = "rag-poisoning"
version = "0.1.0"
description = "Measuring how far one poisoned passage spreads through a retrieval-augmented QA pipeline, and what defences cost."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kameswara Sai Srikar Manda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "matplotlib>=3.8",
]

[project.scripts]
poison = "ragpoison.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpoison"]

[tool.pytest.ini_options]
testpaths = ["tests"]
